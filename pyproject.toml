[project]
name = "distributed-training-framework"
version = "0.1.0"
description = "A lightweight PyTorch framework for distributed training."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "loguru>=0.7.3",
    "numpy>=2.5.2",
    "tokenizers>=0.23.1",
    "torch>=2.13.0",
    "torchdata>=0.11.0",
    "wandb>=0.29.0",
]

[project.scripts]
distributed-training-framework = "distributed_training_framework:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "model"
